[project]
name = "soccer-analytics"
version = "0.1.0"
description = "Soccer video analytics: detection, tracking, metrics, and dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26",
    "scikit-learn>=1.5.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "easyocr>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
